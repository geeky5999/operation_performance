apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: operations-ai
spec:
  replicas: 1
  selector:
    matchLabels: {app: mlflow}
  template:
    metadata:
      labels: {app: mlflow}
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.14.3
          args: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000"]
          ports:
            - {name: http, containerPort: 5000}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: operations-ai
spec:
  selector: {app: mlflow}
  ports:
    - {port: 5000, targetPort: http}

