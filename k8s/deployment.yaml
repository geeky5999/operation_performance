apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-performance
  namespace: operations-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: operations-performance
  template:
    metadata:
      labels:
        app: operations-performance
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: ghcr.io/geeky5999/operation_performance:latest
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8501}
            - {name: metrics, containerPort: 8000}
          env:
            - {name: METRICS_PORT, value: "8000"}
            - {name: MLFLOW_TRACKING_URI, value: "http://mlflow:5000"}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: {drop: ["ALL"]}

